                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
                firstName:
                  type: string
                  maxLength: 64
                middleName:
                  type: string
                  maxLength: 64
                lastName:
                  type: string
                  maxLength: 128
                nickName:
                  type: string
                  maxLength: 50
