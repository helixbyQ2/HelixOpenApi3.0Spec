  /card/lock:
    post:
      tags:
        - Card
      summary: Lock a card
      description: >
        Lock a card. Most locks can be reversed by calling
        [/card/unlock](https://docs.helix.q2.com/reference/cardunlock). Please
        check the [/card/unlock](https://docs.helix.q2.com/reference/cardunlock)
        documentation to see which lock scenarios can be subsequently unlocked. 


        Will apply a `lockTypeCode` of `CST` on success and all card-based
        transactions will fail.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlock
      operationId: cardLock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - cardId
                - lockReasonTypeCode
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                lockReasonTypeCode:
                  type: string
                  enum:
                    - UNK
                    - FRD
                    - DMG
                    - TMP
                  description: |
                    - `UNK`: Unknown
                    - `FRD`: Fraud
                    - `DMG`: Physical Damage
                    - `TMP`: Temporary
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/card" target="_blank">card</a>
            object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          $ref: '#/components/schemas/HelixId'
                        message:
                          type: string
                  requestId:
                    type: string
                    example: b75a96f8-2fbc-4b14-9ba4-7b06aa431c9d
                  status:
                    type: integer
                    enum:
                      - 400
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                            - 50401
                        message:
                          type: string
                          example: User is not authorized
                  requestId:
                    type: string
                    enum:
                      - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                      - 401
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                            - 50404
                        message:
                          type: string
                          example: >-
                            The requested resource
                            'https://sandbox-api.helix.q2.com/customer/updat/805592'
                            was not found
                  requestId:
                    type: string
                    example: b75a96f8-2fbc-4b14-9ba4-7b06aa431c9d
                  status:
                    type: integer
                    enum:
                      - 404
        '405':
          description: HTTP Method Not Allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                            - 50405
                        message:
                          type: string
                          example: >-
                            The HTTP method 'POST' for requested resource
                            'https://sandbox-api.helix.q2.com/customer/get/805594'
                            is not allowed.
                  requestId:
                    type: string
                    enum:
                      - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                      - 405
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                            - 50429
                        message:
                          type: string
                          example: Rate limit exceeded
                  requestId:
                    type: string
                    enum:
                      - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                      - 429
  /card/unlock:
    post:
      tags:
      - Card
      summary: Unlock a card
      description: 'Unlock a card. Can be reversed by calling [/card/lock](https://docs.helix.q2.com/reference/cardlock).
        The following matrix details when this call will succeed or fail.


        | Current lockTypeCode | Current lockReasonTypeCode | Result |

        | -------------------- | -------------------------- | ------ |

        | `CST` | `UNK` - Uknown | Success |

        | `CST` | `DMG` - Physical Damage | Success |

        | `CST` | `TMP` - Temporary | Success |

        | `CST` | `ADM` - Administrative | Success |

        | `CST` | `LST` - Lost | Fail - Lost cards can never be used again |

        | `CST` | `STL` - Stolen | Fail - Stolen cards can never be used again |

        | `CST` | `FRD` - Suspected Fraud | Fail - Suspected Fraud cards can never
        be used again |

        | `SYS` | `LST` - Lost | Fail - Lost cards can never be used again |

        | `SYS` | `STL` - Stolen | Fail - Stolen cards can never be used again |

        | `SYS` | `FRD` - Suspected Fraud | Fail - Suspected Fraud cards can never
        be used again |

        | `SYS` | `ADM` - Administrative | Fail - Only Admin Console or an automated
        process can unlock |

        | `SYS` | `PIN` - PIN Retry Limit Exceeded | Fail - Only Admin Console or
        an automated process can unlock |

        | `SYS` | `TMP` - Temporary | Fail - Only Admin Console or an automated process
        can unlock


        The card will have a `lockTypeCode` of `UNL` upon successful completion of
        this call. The card will be unlocked and ready for transactions to take place.

        '
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardunlock
      operationId: cardUnlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              properties:
                customerId:
                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
                cardId:
                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/400
        '401':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/401
        '404':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/404
        '405':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/405
        '429':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/429
