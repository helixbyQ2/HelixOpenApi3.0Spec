                - dFIAccountNumber
                - direction
                - isPrenote
                - isReversal
                - receiverAccountType
                - receiverName
                - recieverFIRoutingNumber
                - standardEntryClassCode
              properties:
                accountId:
                  allOf:
                    - description: >-
                        The accountId to which funds are being deposited or from
                        which funds are being withdrawn. **Note:** This is not
                        accountNumber.
                    - $ref: '#/components/schemas/HelixId'
                amount:
                  type: number
                  format: decimal
                  minimum: 0.01
                companyEntryDescription:
                  type: string
                  maxLength: 10
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dFIAccountNumber:
                  type: string
                  maxLength: 17
                direction:
                  enum:
                    - Credit
                    - Debit
                effectiveEntryDate:
                  type: string
                  format: date
                  description: >-
                    If `effectiveEntryDate` is not provided, the transaction
                    will be processed in the next available ACH transfer window.
                isPrenote:
                  type: boolean
                isReversal:
                  type: boolean
                paymentRelatedInformation:
                  type: string
                  maxLength: 80
                receiverAccountType:
                  enum:
                    - Checking
                    - Savings
                    - Loan
                    - General Ledger
                receiverName:
                  type: string
                  maxLength: 22
                receiverFIRoutingNumber:
                  type: string
                  maxLength: 9
                standardEntryClassCode:
                  type: string
                  maxLength: 3
                tag:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/transaction"
            target="_blank">transaction</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /transfer/void:
    post:
      tags:
        - Transfer
      summary: Void a transfer
      description: >
        Void a transfer previously created via
        [/transfer/create](https://docs.helix.q2.com/reference/transfercreate).


        **Note:** Only transactions with `status=Initiated` may be voided.
      externalDocs:
        url: https://docs.helix.q2.com/reference/transfervoid
      operationId: transferVoid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - customerId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                tag:
                  allOf:
                    - description: Required if `transactionId` not present
                    - $ref: '#/components/schemas/TagProperty'
                transactionId:
                  allOf:
                    - description: Required if `tag` not present
                    - $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/transfer-response"
            target="_blank">transferResponse</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferVoid200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /transfer/wire/create:
    post:
      tags:
        - Transfer - Wire
      summary: Create a wire
      externalDocs:
