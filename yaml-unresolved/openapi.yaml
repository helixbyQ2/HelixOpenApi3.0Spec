      allOf:
        - $ref: '#/components/schemas/CardArray200Response/allOf/0'
        - type: object
          properties:
            data:
              properties:
                encryptedPassData:
                  type: string
                  format: byte
                  description: >-
                    Base64 encoded encrypted authentication data consisting of
                    encrypted PAN, expiry date, name etc. This value should be
                    passed through to Apple as is.
                activationData:
                  type: string
                  format: byte
                  description: >-
                    Base64 encoded activation data consisting of encrypted
                    nonce, noncesignature, and authCode. This value should be
                    passed through to Apple as is.
                ephemeralPublicKey:
                  type: string
                  format: byte
                  description: >-
                    Base64 encoded encrypted JSON containing the sensitive
                    information needed to add a card to Apple Pay. This value
                    should be passed through to Apple as is.
