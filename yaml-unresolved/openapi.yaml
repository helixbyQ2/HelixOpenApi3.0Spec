  /customer/list:
    get:
      tags:
        - Customer
      summary: List customers
      description: >
        List all customers for your program. The results are ordered by
        `lastName` then `firstName`. Each customer object will contain an
        additional property, `customerCount`, which can be used in combination
        with the `pageNumber` and `pageSize` query params to paginate results.
        All customers, regardless of any flags or status, will be returned.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerlist
      operationId: customerList
      parameters:
        - name: pageNumber
          in: query
          required: false
          description: Which page of the results to return. Use 0 to get the first page.
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 200
        - name: pageSize
          in: query
          required: false
          description: How many results to return on each page. Maximum is 200.
          schema:
            type: integer
            default: 200
            minimum: 0
            maximum: 200
        - name: customerClass
          in: query
          required: false
          description: >-
            Limit which type of customers are returned. If no value is passed,
            all customers are returned.
          schema:
            type: string
            enum:
              - individual
              - business
      responses:
        '200':
          description: >-
            An array of <a href="https://docs.helix.q2.com/docs/customer"
            target="_blank">customer</a> objects with null arrays for the
            following properties: accounts, addresses, cards, externalAccounts,
            phones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
