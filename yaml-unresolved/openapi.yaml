  /card/reissue:
    post:
      tags:
      - Card
      summary: Reissue a card
      description: >-
        Reissue a card and, when applicable, send a new physical card to the
        customer. Use this endpoint when a card needs to be replaced because it
        was damaged, lost, stolen, compromised, affected by fraud, or when an
        immediate renewal is needed. Some reissue reasons keep the same card
        number. Other reasons create a new card number.


        If card-maintenance fees apply, the response includes the applied fees
        on the returned card object. If no fees apply, no fee items are returned.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardreissue
      operationId: cardReissue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - reissueReasonTypeCode
              properties:
                customerId:
                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
                cardId:
                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
                reissueReasonTypeCode:
                  type: string
                  enum:
                  - DMG
                  - REN
                  - FRD
                  - LST
                  - STL
                  - NCN
                  - CMP
                  description: '- `DMG`: Physical Damage

                    - `REN`: Renewal

                    - `FRD`: Fraud

                    - `LST`: Lost

                    - `STL`: Stolen

                    - `NCN`: Name Change with New PAN

                    - `CMP`: Compromised

                    '
                newPin:
                  type: string
                  format: byte
                  description: See the `newPin` attribute on the <a href="https://docs.helix.q2.com/docs/card"
                    target="_blank">card</a> object definition for details.
                qualifierCode:
                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/QualifierCode
                tag:
                  allOf:
                  - description: Tag to associate with the new cardId
                  - $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/Tag
                requestingCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer requesting
                      to reissue an existing card for a business cardholder
                  - $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
                expediteCard:
                  type: boolean
                  description: Set to `true` to request expedited physical-card delivery,
                    when the program supports expedited card orders.
                byPassExpediteCardFee:
                  type: boolean
                  description: Set to `true` when the program, rather than the customer,
                    should pay the expedited card fee.
                photoImageId:
                  type: string
                  maxLength: 18
                  description: Optional card-production identifier.
                cardDesignIdentificationNumber:
                  type: string
                  maxLength: 16
                  description: Optional card-production identifier.
                cardCarrierMessage:
                  type: string
                  maxLength: 6
                  description: Optional card-production identifier.
                cardVendorUniqueData:
                  type: string
                  maxLength: 50
                  description: Optional card-production identifier.
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card"
            target="_blank">card</a> object. If card-maintenance fees were applied,
            data.fees contains one item for each applied fee. If no fees apply, no
            fee items are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
              examples:
                reissuedCardWithFee:
                  summary: Reissue succeeded with an applied fee
                  value:
                    errors: []
                    requestId: 1249a3bf-aca1-40dd-9fba-2a3193550c39
                    status: 200
                    data:
                      cardId: 123456
                      customerId: 789012
                      cardNumberMasked: '************1234'
                      status: PendingVerification
                      expireMonth: 4
