      summary: Reset a card pin
      description: 'Create a request to reset the PIN for a card. **Note:** For Visa
        DPS programs, PIN resets are initiated in real-time and are confirmed by DPS
        which raises a <a href="https://docs.helix.q2.com/docs/event-types#common-events"
