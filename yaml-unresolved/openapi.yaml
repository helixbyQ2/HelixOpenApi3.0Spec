                beneficiaryRoutingNumber:
                  type: string
                beneficiaryFIName:
                  type: string
                beneficiaryFIAddress:
                  type: string
                beneficiaryFICity:
                  type: string
                beneficiaryFIState:
                  type: string
                beneficiaryFIPostalCode:
                  type: string
                originatorToBeneficiaryInformationLine1:
                  type: string
                originatorToBeneficiaryInformationLine2:
                  type: string
                originatorToBeneficiaryInformationLine3:
                  type: string
                originatorToBeneficiaryInformationLine4:
                  type: string
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
