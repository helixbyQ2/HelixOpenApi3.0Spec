openapi: 3.0.0
info:
  title: Helix API
  version: 3.0.0
  description: >-
    Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x
    and is subject to change at any time.**
servers:
  - url: https://sandbox-api.helix.q2.com
    description: Sandbox server
  - url: https://api.helix.q2.com
    description: Production server
tags:
  - name: Account
    description: Endpoints for the account object
  - name: Account - Entitlement
    description: Endpoints related to account entitlements
  - name: Account - Hold
    description: Endpoints related to account holds
  - name: Account - Limit
    description: Endpoints related to account limits
  - name: Account - Stop Pay
    description: Endpoints related to account stop payments
  - name: Account Beneficiary
    description: Endpoints for the accountBeneficiary object
  - name: Bank Document
    description: Endpoints for the bankDocument object
  - name: Card
    description: Endpoints for the card object
  - name: Card - Fraud Text Alert
    description: Endpoints related to fraud text alerts
  - name: Card - Limit
    description: Endpoints related to card limits
  - name: Card - Mock
    description: Endpoints related to simulating card workflows
  - name: Card - Provision
    description: Endpoints related to card provisioning
  - name: Card - Risk Factor
    description: Endpoints related to card risk factors
  - name: Card Control
    description: Endpoints for the cardControl object
  - name: Customer
    description: Endpoints for the customer object
  - name: Customer - Due Diligence
    description: Endpoints related to customer due diligence
  - name: Customer Beneficiary
    description: Endpoints for the customerBeneficiary object
  - name: Customer Document
    description: Endpoints for the customerDocument object
  - name: Customer Relationship
    description: Endpoints for the customerRelationship object
  - name: External Account
    description: Endpoints for the externalAccount object
  - name: External Account Document
    description: Endpoints for the externalAccountDocument object
  - name: Fee
    description: Endpoints for the fee object
  - name: Program
    description: Endpoints for the program object
  - name: Statement
    description: Endpoints for the statement object
  - name: Transaction
    description: Endpoints for the transaction object
  - name: Transaction - Wire
    description: Endpoints related to wire transactions
  - name: Transfer
    description: Endpoints for the transfer object
  - name: Transfer - Wire
    description: Endpoints related to wire transfer objects
security:
  - basicAuth: []
paths:
  /account/create:
    post:
      tags:
        - Account
      summary: Create an account
      description: >-
        Create a new account for a customer. See <a
        href="https://docs.helix.q2.com/docs/account" target="_blank">account
        object definition</a> for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountcreate
      operationId: accountCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - name
                - productId
              properties:
                customerId:
                  allOf:
                    - description: >-
                        The Helix-assigned ID for the customer who owns the
                        account. For business accounts, this is the `customerId`
                        of the business entity.
                    - $ref: '#/components/schemas/HelixId'
                name:
                  type: string
                  maxLength: 50
                productId:
                  $ref: '#/components/schemas/HelixId'
                targetDate:
                  type: string
                  format: date-time
                  example: '2000-07-04T00:00:00.000+00:00'
                isclosable:
                  type: boolean
                category:
                  type: string
                  maxLength: 50
                subcategory:
                  type: string
                  maxLength: 50
                tag:
                  $ref: '#/components/schemas/TagProperty'
                recurringContributionType:
                  type: string
                  enum:
                    - None
                    - BiWeekly
                    - Monthly
                recurringContributionAmount:
                  type: number
                  format: decimal
                recurringContributionFromExternalAccountId:
                  $ref: '#/components/schemas/HelixId'
                recurringContributionStartDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                recurringContributionEndDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                customField1:
                  type: string
                  maxLength: 50
                customField2:
                  type: string
                  maxLength: 50
                customField3:
                  type: string
                  maxLength: 50
                customField4:
                  type: string
                  maxLength: 50
                customField5:
                  type: string
                  maxLength: 50
                accountMinimumBalance:
                  type: number
                  format: decimal
                requestingCustomerId:
                  allOf:
                    - description: >-
                        The Helix-assigned unique ID for the customer requesting
                        to open the account. Only used when opening a business
                        account.
                    - $ref: '#/components/schemas/HelixId'
                accountNumber:
                  type: string
                  maxLength: 50
                  pattern: ^[0-9]{1,50}$
                  description: >-
                    If none specified, Helix will automatically assign an
                    account number. **Note:** Custom account numbers requires
                    approval from Q2 and your bank partner. Custom account
                    numbers must be numeric.
                legalName1:
                  type: string
                  maxLength: 100
                legalName2:
                  $ref: '#/components/schemas/LegalName'
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/account"
            target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/get/{customerId}/{accountId}:
    get:
      tags:
        - Account
      summary: Get an account
      description: Retrieve a single account for the given `customerId` and `accountId`
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountget
      operationId: accountGet
      parameters:
        - $ref: '#/components/parameters/CustomerIdPath'
        - name: accountId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/docs/account"
            target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/getByTag/{customerId}/{tag}:
    get:
      tags:
        - Account
      summary: Get an account via tag
      description: Retrieve a single account for the given `customerId` and `tag`
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountgetbytag
      operationId: accountGetByTag
      parameters:
        - $ref: '#/components/parameters/CustomerIdPath'
        - $ref: '#/components/parameters/TagPath'
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/account"
            target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/list/{customerId}:
    get:
      tags:
        - Account
      summary: List accounts
      description: >-
        Retrieve all accounts for the given `customerId`. Accounts with
        `status=Closed` may disappear from this list after a period of time no
        shorter than 32 days.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountlist
      operationId: accountList
      parameters:
        - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: >-
            An array of <a href="https://docs.helix.q2.com/docs/account"
            target="_blank">account</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/update:
    post:
      tags:
        - Account
      summary: Update an account
      description: >-
        See <a href="https://docs.helix.q2.com/docs/account"
        target="_blank">account object definition</a> for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountupdate
      operationId: accountUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - accountId
                - name
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                name:
                  type: string
                  maxLength: 50
                productId:
                  allOf:
                    - description: >-
                        **Note:**`productId` updates are not real-time in the
                        production environment. Changes may be delayed by up to
                        24 hours.
                    - $ref: '#/components/schemas/HelixId'
                targetAmount:
                  type: number
                  format: decimal
                targetDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                category:
                  type: string
                  maxLength: 50
                subcategory:
                  type: string
                  maxLength: 50
                tag:
                  $ref: '#/components/schemas/TagProperty'
                recurringContributionType:
                  $ref: '#/components/schemas/RecurringContributionType'
                recurringContributionAmount:
                  type: number
                  format: decimal
                recurringContributionFromExternalAccountId:
                  $ref: '#/components/schemas/HelixId'
                recurringContributionStartDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                recurringContributionEndDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                customField1:
                  type: string
                  maxLength: 50
                customField2:
                  type: string
                  maxLength: 50
                customField3:
                  type: string
                  maxLength: 50
                customField4:
                  type: string
                  maxLength: 50
                customField5:
                  type: string
                  maxLength: 50
                accountMinimumBalance:
                  type: number
                  format: decimal
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/account"
            target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/lock:
    post:
      tags:
        - Account
      summary: Lock an account
      description: >
        Lock an account. Most locks can be reversed by calling
        [/account/unlock](https://docs.helix.q2.com/reference/accountunlock).
        Please check the
        [/account/unlock](https://docs.helix.q2.com/reference/accountunlock)
        documentation to see which lock scenarios can be subsequently unlocked.

         Will apply a lockTypeCode of `CST` or `SYS` on success and the account will be locked, meaning no funds transfers can take place.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountlock
      operationId: accountLock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - accountId
                - lockTypeCode
                - lockReasonTypeCode
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                lockTypeCode:
                  type: string
                  enum:
                    - CST
                    - SYS
                  description: |
                    - `CST`: Customer Locked
                    - `SYS`: System Locked
                lockReasonTypeCode:
                  type: string
                  enum:
                    - UNK
                    - FRD
                    - ADM
                    - TMP
                    - FRZ
                    - SUS
                    - CO
                    - RTN
                    - REC
                    - DED
                    - DOR
                  description: |
                    - `UNK`: Unknown
                    - `FRD`: Fraud investigation
                    - `ADM`: Administrative
                    - `TMP`: Temporary
                    - `FRZ`: Freeze
                    - `SUS`: Suspected fraud
                    - `CO`: Credits only
                    - `RTN`: Return risk
                    - `REC`: Recovery
                    - `DED`: Deceased
                    - `DOR`: Dormant
                accountLockClassificationCode:
                  type: string
                  nullable: true
                  maxLength: 10
                  description: >-
                    An optional program-configured classification code for the
                    lock. Must be a value from the configured list for the
                    program.
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/account"
            target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/unlock:
    post:
      tags:
        - Account
      summary: Unlock an account
      description: >
        The following matrix details when this call will succeed or fail


        | Current lockTypeCode | Current lockReasonTypeCode | Result |

        | -------------------- | -------------------------- | ------ |

        | `CST`                | `UNK` - Unknown            | Success |

        | `CST`                | `TMP` - Temporary          | Success |

        | `CST`                | `FRZ` - Freeze             | Success |

        | `CST`                | `ADM` - Administrative     | Success |

        | `CST`                | `SUS` - Suspected fraud    | Success |

        | `CST`                | `CO` - Credits only        | Success |

        | `CST`                | `RTN` - Return risk        | Success |

        | `CST`                | `REC` - Recovery           | Success |

        | `CST`                | `DED` - Deceased           | Success |

        | `CST`                | `DOR` - Dormant            | Success |

        | `CST`                | `FRD` - Fraud investigation | Fail - Fraud
        investigation lock can not be unlocked by CST |

        | `SYS`                | `TMP`, `FRD`, `FRZ`, `ADM`, `SUS`, `CO` | Fail
        - SYS lock type cannot be unlocked by CST |


        The account will have a `lockTypeCode` of `UNL` upon successful
        completion of this call. The account is unlocked and ready for transfers
        to take place.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountunlock
      operationId: accountUnlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - accountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/account"
            target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/close:
    post:
      tags:
        - Account
      summary: Close an account
      description: >-
        Close an account. If the account balance is greater than $0 or any
        interest is owed on the account those amounts are calculated and a <a
        href="https://docs.helix.q2.com/docs/transaction"
        target="_blank">transaction</a> is implicitly created with the sum of
        those amounts being credited into the given `closeToAccountId`. That
        transaction's `tag` property is also assigned the value in the
        `transactionTag` property (if specified).
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountclose
      operationId: accountClose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - accountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                closeToAccountId:
                  allOf:
                    - description: >
                        The Helix-assigned ID for the account to receive
                        remaining funds. This can be the accountId of an 

                        <a href="https://docs.helix.q2.com/docs/account"
                        target="_blank">account</a> or the externalAccountId of
                        an 

                        <a
                        href="https://docs.helix.q2.com/docs/external-account"
                        target="_blank">externalAccount</a>. 

                        **Notes:** `closeToAccountId` is required if the account
                        has a balance or earns interest. 

                        To close to a petty cash account, use the Helix Admin
                        Console or the 

                        <a
                        href="https://docs.helix.q2.com/docs/bulk-account-close-process"
                        target="_blank">Bulk Account Close Process</a>.
                    - $ref: '#/components/schemas/HelixId'
                transactionTag:
                  allOf:
                    - description: >-
                        A program-wide unique identifier that is to be
                        associated with the transaction created to move any
                        funds out of the account being closed.
                    - $ref: '#/components/schemas/TagProperty'
                closeReason:
                  type: string
                  enum:
                    - Fraud
                    - Never funded
                    - BSA reasons
                    - Relationship ended
                    - Deceased
                    - Other
                    - Consolidating Bank Accounts
                    - re-CIP
                    - Risk-Related
                    - Member Requested
                    - Negative Balance (Reopen Eligible)
                    - Negative Balance (Reopen Ineligible)
                    - ID Theft
                    - Account Take Over
                    - Dormant
                  description: >
                    The following values are not enabled by default and require
                    additional configuration. Contact the Helix Support team for
                    more information.
                     
                    - `re-CIP`

                    - `Risk-Related`

                    - `Member Requested`

                    - `Negative Balance (Reopen Eligible)`

                    - `Negative Balance (Reopen Ineligible)`

                    - `ID Theft`

                    - `Account Take Over`

                    - `Dormant`
                closeReasonNotes:
                  type: string
                  maxLength: 255
                  description: Required if `closeReason` is `Other`
      responses:
        '200':
          description: The account closure and transaction (if applicable) details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClose200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/addEntitlement:
    post:
      tags:
        - Account - Entitlement
      summary: Add an entitlement
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountaddentitlement
      operationId: accountAddEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountId
                - requestingCustomerId
                - targetCustomerId
                - entitlement
              properties:
                accountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                    - description: >-
                        The helix-assigned unique ID for the customer requesting
                        to add an entitlement
                    - $ref: '#/components/schemas/HelixId'
                targetCustomerId:
                  allOf:
                    - description: >-
                        The helix-assigned unique ID for the customer being
                        granted an entitlement
                    - $ref: '#/components/schemas/HelixId'
                entitlement:
                  $ref: '#/components/schemas/AccountAddEditEntitlement200Response/allOf/1/properties/data/properties/entitlement'
      responses:
        '200':
          description: A confirmation the entitlement has been added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAddEditEntitlement200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/listEntitlements/{customerId}/{accountId}:
    get:
      tags:
        - Account - Entitlement
      summary: List Entitlements
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountlistentitlements
      operationId: accountListEntitlements
      parameters:
        - $ref: '#/components/parameters/CustomerIdPath'
        - $ref: '#/components/parameters/AccountIdPath'
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: >-
            An array of <a
            href="https://docs.helix.q2.com/docs/account-entitlement"
            target="_blank">accountEntitlement</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEntitlementArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/editEntitlement:
    post:
      tags:
        - Account - Entitlement
      summary: Edit an entitlement
      externalDocs:
        url: https://docs.helix.q2.com/reference/accounteditentitlement
      operationId: accountEditEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountId
                - requestingCustomerId
                - targetCustomerId
                - entitlement
              properties:
                accountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                    - description: >-
                        The helix-assigned unique ID for the customer requesting
                        to edit an entitlement
                    - $ref: '#/components/schemas/HelixId'
                targetCustomerId:
                  allOf:
                    - description: >-
                        The helix-assigned unique ID for the customer whose
                        entitlement is being edited
                    - $ref: '#/components/schemas/HelixId'
                entitlement:
                  $ref: '#/components/schemas/AccountAddEditEntitlement200Response/allOf/1/properties/data/properties/entitlement'
      responses:
        '200':
          description: A confirmation the entitlement has been edited.
