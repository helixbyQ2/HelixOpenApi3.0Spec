      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlimitoverride
      operationId: cardLimitOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - cardId
                - classification
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                classification:
                  allOf:
                    - description: >-
                        For `highrisk` the `purchaseLimit` and/or
                        `withdrawalLimit` must be lower than the program default
                        limits. For `lowrisk` the `purhcaseLimit` and/or
                        `withdrawalLimit` must be lower than the bank ceiling
                        limits but higher than the program default limits.
                        Program and bank limits can be obtained via
                        [/card/limit/get](https://docs.helix.q2.com/reference/cardlimitget).
                        For `businesscard` the `purchaseLimit` and/or
                        `withdrawalLimit` should be defined based on business
                        defined per cardholder.
                    - type: string
                      enum:
                        - highrisk
                        - lowrisk
                        - businesscard
                purchaseLimit:
                  type: number
                  format: decimal
                  minimum: 0
                  description: Required if `withdrawalLimit` not present
                withdrawalLimit:
                  type: number
                  format: decimal
                  description: Required if `purchaseLimit` not present
                  minimum: 0
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
            href="https://docs.helix.q2.com/docs/card-limits"
