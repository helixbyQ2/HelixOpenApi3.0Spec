    post:
      tags:
        - Customer
      summary: Create a customer
      externalDocs:
        url: https://docs.helix.q2.com/reference/customercreate
      operationId: customerCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - isSubjectToBackupWithholding
                - isOptedInToBankCommunication
                - isDocumentsAccepted
              properties:
                firstName:
                  type: string
                  maxLength: 64
                middleName:
                  $ref: '#/components/schemas/FirstName'
