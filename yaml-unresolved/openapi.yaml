                qualifierCode:
                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/QualifierCode
                binId:
                  $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
                newPin:
                  type: string
                  format: byte
                  description: For Shazam programs only. Visa DPS programs must call
                    the [/card/resetPin](https://docs.helix.q2.com/reference/cardresetpin)
                    endpoint separately. For physical-only cards, /card/resetPin can
                    be called once the card moves from `status=Initiated` to `status=Verified`.
                    For dual-issuance cards (physical and digital), /card/resetPin
                    can be called once the card moves from `status=Initiated` to `status=DigitalActivePhysicalPending`.
                isCreateDualIssuanceSinglePAN:
                  type: boolean
                  default: false
                  description: '`true` if this card will be an instant-issued debit
                    card ready for eCommerce activity that can also be provisioned
                    to a digital wallet. If `true` the card will be created with a
                    `status` of `DitalActivePhysicalInitiated` which will shortly
                    change to `DigitalActivePhysicalPending`. When card is in `DigitalActivePhysicalInitiated`
                    or `DigitalActivePhysicalPending` it can be provisioned into a
                    digital wallet via [/card/provision/applePay](https://docs.helix.q2.com/reference/cardprovisionapplepay)
                    or [/card/provision/googlePay](https://docs.helix.q2.com/reference/cardprovisiongooglepay).
                    When card is in `DigitalActivePhysicalPending` it will need to
                    be verified via [/card/verify](https://docs.helix.q2.com/reference/cardverify)
                    before a customer can use the physical card.

                    '
                isPhysicalCardOrdered:
                  type: boolean
                  default: true
                  description: "`true` to order a physical card, `false` to waive.\
                    \ \n"
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the customer requesting
                      to create a new card for a business cardholder
                  - $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/schemas/HelixId32
                cardCarrierMessage:
                  type: string
                  maxLength: 6
                  description: Identifier used uniquely by various card production
                    facilities for mapping card configurations
                cardDesignIdentificationNumber:
                  type: string
                  maxLength: 16
                  description: Identifier used uniquely by various card production
                    facilities for mapping card configurations
                cardVendorUniqueData:
                  type: string
                  maxLength: 50
                  description: Identifier used uniquely by various card production
                    facilities for mapping card configurations
                photoImageId:
                  type: string
                  maxLength: 18
                  description: Identifier used uniquely by various card production
                    facilities for mapping card configurations
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/400
        '401':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/401
        '404':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/404
        '405':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/405
        '429':
          $ref: https://raw.githubusercontent.com/helixbyQ2/HelixOpenApi3.0Spec/prod/components/components.yaml#/components/responses/429
