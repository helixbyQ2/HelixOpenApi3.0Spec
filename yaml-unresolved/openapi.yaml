                  type: string
                  maxLength: 128
                suffix:
                  type: string
                  maxLength: 20
                birthDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                gender:
                  type: string
                  enum:
                    - M
                    - F
                    - U
                culture:
                  type: string
                  enum:
                    - en-US
                    - es-US
                  description: |
                    Accepted values vary by program:
                      - `en-US`: English
                      - `es-US`: Spanish
                tag:
                  $ref: '#/components/schemas/TagProperty'
                taxId:
                  type: string
                  maxLength: 30
                  description: No formatting (no dashes, spaces, etc).
                taxIdType:
                  type: string
                  enum:
                    - SSN
                    - EIN
                    - ITIN
                driversLicenseNumber:
                  type: string
                  maxLength: 30
                driversLicenseState:
                  $ref: '#/components/schemas/FormationState'
                driversLicenseIssueDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                driversLicenseExpireDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                passportNumber:
                  type: string
                  maxLength: 30
                passportCountry:
                  type: string
                  maxLength: 5
                passportIssueDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                passportExpireDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                emailAddress:
                  type: string
                  maxLength: 255
                foreignDocumentCountryCode:
                  type: string
                  maxLength: 3
                foreignDocumentExpirationDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                foreignDocumentNumber:
                  type: string
                  maxLength: 30
                foreignDocumentType:
                  type: string
                  enum:
                    - DriversLicense
                    - ConsularIdCard
                    - Passport
                    - PermanentResidentCard
                    - EmploymentAuthorizationCard
                    - VoterRegistrationCard
                    - IdentificationCard
                isSubjectToBackupWithholding:
                  type: boolean
                isOptedInToBankCommunication:
                  type: boolean
                isDocumentsAccepted:
                  type: boolean
                customField1:
                  type: string
                  maxLength: 100
                customField2:
                  type: string
                  maxLength: 100
                customField3:
                  type: string
                  maxLength: 100
                customField4:
                  type: string
                  maxLength: 100
                customField5:
                  type: string
                  maxLength: 100
                preferredName:
                  type: string
                  maxLength: 21
                usePreferredNameOnCard:
                  type: boolean
                  default: false
                residencyStatusType:
                  type: string
                  enum:
                    - UsCitizen
                    - ResidentAlien
                    - NonResidentAlien
                addresses:
                  type: array
                  items:
                    type: object
                    required:
                      - addressLine1
                      - addressType
                      - city
                      - country
                      - postalCode
                      - state
                    properties:
                      addressLine1:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine2:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine3:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine4:
                        $ref: '#/components/schemas/AddressLine'
                      addressType:
                        type: string
                        enum:
                          - Residence
                          - Mailing
                      city:
                        $ref: '#/components/schemas/CityProperty'
                      country:
                        $ref: '#/components/schemas/CountryProperty'
                      isActive:
                        type: boolean
                        readOnly: true
                      postalCode:
                        $ref: '#/components/schemas/PostalCode'
                      state:
                        $ref: '#/components/schemas/FormationState'
                phones:
                  type: array
                  items:
                    type: object
                    required:
                      - number
                      - phoneType
                    properties:
                      isActive:
                        type: boolean
                        readOnly: true
                      number:
                        type: string
                      phoneType:
                        type: string
                        enum:
                          - Home
                          - Mobile
                          - Office
      responses:
        '200':
          description: A `customerId` and `customerToken` (if enabled for program)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreate200Response'
