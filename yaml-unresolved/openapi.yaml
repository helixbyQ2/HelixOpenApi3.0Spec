      summary: Simulate Falcon Fraud Message in sandbox environment
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardmockadminfalconfraud
      tags:
        - Card - Mock
      operationId: cardMockAdminFalconFraud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - cardId
                - caseStatus
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                caseStatus:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: >
                    Possible values:

                    - `0`: Generates a real-time event with
                    `userEventTypeId=10026` and
                    `falconCaseStatus=ACTIVEACTIVE_CASE_SUBSTATUS_DLR_ACTIVENO_BLOCK_SERVICE|`

                    - `1`: Generates a real-time event with
                    `userEventTypeId=10025` and
                    `falconCaseStatus=CLOSEDNOT_FRAUDNO_BLOCK_SERVICE|`

                    - `2`: Generates a real-time event with
                    `userEventTypeId=10025` and
                    `falconCaseStatus=CLOSEDNOT_FRAUDREMOVE_BLOCK_SERVICE|`

                    - `3`: Generates a real-time event with
                    `userEventTypeId=10024` and
                    `falconCaseStatus=CLOSEDUNABLE_CONFIRMED_FRAUDFRAUD_BLOCK_SERVICE|CASE_FRAUD_TYPE_OTHER|`
      responses:
        '200':
          description: A 200 status with no `data` property present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardArray200Response/allOf/0'
