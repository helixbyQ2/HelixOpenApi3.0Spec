      description: >
        Add an account to a card. Can be reversed by calling
        [/card/removeAccount](https://docs.helix.q2.com/reference/cardremoveaccount)


        The `customerId` attempting to add the account must have an
        `accessTypeCode` of `FULL` to that account and the customer itself must
        have a `accessTypeCode` of `FULL` or `ACCT`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardaddaccount
      operationId: cardAddAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - cardId
                - accountId
                - cardPriority
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                cardPriority:
                  allOf:
                    - description: >-
                        Priority the `accountId` will have. Must be between `1`
                        and `4` inclusive. If this matches the priority of an
                        existing account, that account's priority will be slid
                        down one slot (as will all other lower priority accounts
                        as needed)
                    - type: integer
                      format: int32
                      minimum: 1
                      maximum: 4
      responses:
        '200':
          description: >-
            An <a href="https://docs.helix.q2.com/reference/response-format"
            target="_blank">envelope</a> whose data node is a <a
